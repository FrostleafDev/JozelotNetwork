network-name: 'jozelot.de'
brand-name: '§b§ljozelot.de§r'

tab-refresh-time: 1

server-links:
  - |
    <#f90036><b>Webseite
    https://jozelot.de
  - |
    <#7289DA><b>Discord
    https://jozelot.de/discord
  - |
    <#00A4FC><b>Hosting
    https://panel.jozelot.de

protocol-versions:
  min: 767
  recommended: 773
  max: 774

punishment-reasons:
  - "101 Hacking"
  - "102 Killaura"
  - "103 Movement"
  - "104 X-Ray"
  - "105 AutoClicker"
  - "106 Reach"
  - "107 Unfairer Vorteil"
  - "201 Beleidigung"
  - "202 Schwere Beleidigung"
  - "203 Rassismus"
  - "204 Spamming"
  - "205 Werbung"
  - "206 Provokation"
  - "207 Wortwahl"
  - "208 Drohung"
  - "209 Radikalismus"
  - "301 Griefing"
  - "302 Scamming"
  - "303 Trolling"
  - "304 Bug Using"
  - "401 Unangemessener Name"
  - "402 Unangemessener Skin"
  - "403 Ban Umgehung"
  - "404 Account Sicherheit"
  - "405 Vortäuschen von Rechten"
  - "406 Sicherheit-Bann"

blocked-commands:
  hard-blocked:
    - "/op"
    - "/deop"
    - "/stop"
    - "/reload"
    - "/rl"
    - "/ban-ip"
    - "/?"
    - "/help"
    - "/ver"
    - "/version"
    - "/about"
    - "/icanhasbukkit"
    - "/luckperms"
    - "/perm"
    - "/permission"
    - "/perms"
    - "/permissions"
    - "/luckpermsvelocity"
    - "/teammsg"
    - "/pardon"
    - "/pardon-ip"
    - "/w"
    - "/me"
    - "/bellyflop"
    - "/gbellyflop"
    - "/gsit"
    - "/gcrawl"
    - "/glayback"
    - "/spin"
    - "/gspin"
    - "/glay"
    - "/layback"
    - "/voicechat"
    - "/voicechatproxy"
    - "/fastasyncworldedit"
    - "/we"

  # Permission: network.commands.bypass.<gruppenname>
  groups:
    building:
      commands:
        - "/headdatabase"
        - "/headdb"
        - "/headmenu"
        - "/hdb"
    worldedit:
      commands:
        - "/worldedit"
        - "/fawe"
    admin:
      commands:
        - "/lp"
        - "/lpv"
        - "/plugins"
        - "/pl"
        - "/trigger"

pterodactyl:
  url: "https://panel.jozelot.de"
  api-key: "KEY"


color-settings:
  primary: '#00A4FC'
  secondary: '#00FC00'
  tertiary: '#FCE300'
  danger: '#f90036'
  grey:  '#A8A8A8'

lobby-server: 'lobby'

# Setup MySQL and Redis Databases
mysql:
  host: 'localhost'
  port: 3306
  database: 'jozelot_network'
  user: ''
  password: ''

redis:
  host: 'localhost'
  port: 6379
  password: ''

